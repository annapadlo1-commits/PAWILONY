  const key='inventory-pro-jurek-last';
  let current=-1;
  function choose(){
    let last=-1;
    try{const saved=sessionStorage.getItem(key);last=saved===null?-1:Number(saved);}catch(e){}
    if(!Number.isInteger(last)||last<0||last>=assets.length)last=current;
    let next=Math.floor(Math.random()*assets.length);
    if(assets.length>1&&next===last)next=(next+1+Math.floor(Math.random()*(assets.length-1)))%assets.length;
    current=next;
    try{sessionStorage.setItem(key,String(next));}catch(e){}
    return next;
  }
  function statusFrom(el,fallback){
    const text=String(fallback||el&&el.textContent||'Ładowanie widoku…').replace(/\s+/g,' ').trim();
    return text.replace(/^🍕\s*/,'')||'Ładowanie widoku…';
  }
  function markup(index,status){
    const title=index===9?'MIKRO JUREK NA CZEKANIE':'JUREK NA CZEKANIE';
    return '<div class="ip-jurek-loader" role="status" aria-live="polite"><img class="ip-jurek-avatar" src="'+assets[index]+'" alt="Jurek czeka razem z Tobą"><div class="ip-jurek-title">'+title+'</div><div class="ip-jurek-status"></div></div>';
  }
  function enhance(el,status,reroll){
    if(!el)return null;
    const shouldChoose=reroll!==false||!el.dataset.ipJurekIndex;
    const index=shouldChoose?choose():Number(el.dataset.ipJurekIndex);
    el.dataset.ipJurekIndex=String(index);
    el.dataset.ipJurekReady='1';
    el.classList.add('ip-jurek-host');
    el.innerHTML=markup(index,status);
    el.querySelector('.ip-jurek-status').textContent=statusFrom(el,status);
    return el;
  }
  function resolve(target){return typeof target==='string'?document.querySelector(target):target;}
  function show(target,status,reroll){
    const el=resolve(target);
    if(!el)return null;
    enhance(el,status,reroll!==false);
    el.hidden=false;
    el.style.display='flex';
    return el;
  }
  function hide(target){
    const el=resolve(target);
    if(el){el.hidden=true;el.style.display='none';}
  }
  function update(target,status){
    const el=resolve(target);
    if(!el)return;
    const node=el.querySelector('.ip-jurek-status');
    if(node)node.textContent=statusFrom(el,status);else enhance(el,status,false);
  }
  function error(target,message){
    const el=resolve(target);
    if(!el)return;
    el.classList.remove('ip-jurek-host');
    el.hidden=false;
    el.style.display='block';
    el.style.color='#c5221f';
    el.style.whiteSpace='pre-wrap';
    el.textContent=message;
  }
  function createOverlay(id,status){
    let el=document.getElementById(id);
    if(!el){el=document.createElement('div');el.id=id;el.className='ip-jurek-overlay';document.body.appendChild(el);}
    return show(el,status,true);
  }
  function enhanceExisting(){
    document.querySelectorAll('#loading.loading,#loading.loading-screen,.loading[id],.loading-screen[id]').forEach(el=>{if(el.dataset.ipJurekReady!=='1')enhance(el,statusFrom(el),true);});
  }
  window.InventoryProLoader={show,hide,update,error,enhance,createOverlay,choose};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',enhanceExisting,{once:true});else enhanceExisting();
})();
</script>
